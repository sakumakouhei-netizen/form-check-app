<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>フォーム比較アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 10px; user-select: none; -webkit-user-select: none; }
    
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #222; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .control-group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    
    button, input[type="file"], input[type="range"] { font-size: 14px; padding: 6px 12px; }
    button { cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { opacity: 0.9; }
    
    /* 速度・コマ送り用ボタンのスタイル */
    .btn-sub { background: #495057; }
    .btn-sub.active { background: #28a745; font-weight: bold; }
    .btn-frame { background: #17a2b8; }

    .color-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      cursor: pointer;
      display: inline-block;
      vertical-align: middle;
      margin: 0 2px;
    }
    .color-btn.selected { outline: 3px solid #007bff; }

    /* 全体表示エリア */
    .view-container {
      position: relative;
      display: flex;
      width: 100%;
      height: calc(100vh - 180px);
      gap: 10px;
      background: #000;
      touch-action: none;
      isolation: isolate;
      overflow: hidden;
    }

    /* 通常（並列）モードのボックス設定 */
    .video-box {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
      transition: all 0.2s ease;
    }

    video { 
      width: 100%; 
      height: 100%; 
      object-fit: contain;
      pointer-events: auto;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    /* === 重ね合わせモード（CSSレイヤー制御） === */
    .view-container.overlay-mode {
      display: block;
    }

    .view-container.overlay-mode #box1 {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    .view-container.overlay-mode #box2 {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      background: transparent;
      will-change: transform, opacity;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }

    .view-container.overlay-mode video {
      pointer-events: none;
    }

    /* お絵描き用キャンバス */
    #drawCanvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
      will-change: transform;
      -webkit-transform: translateZ(0);
      transform: translateZ(0);
    }
    #drawCanvas.active {
      pointer-events: auto;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <!-- 操作パネル -->
  <div class="controls">
    <div class="control-group">
      <label>お手本: <input type="file" id="file1" accept="video/*"></label>
      <label>自分: <input type="file" id="file2" accept="video/*"></label>
    </div>
    
    <div class="control-group">
      <button id="btnPlayPause">同時再生 / 停止</button>
      <button id="btnReset">最初に戻す</button>
    </div>

    <!-- 速度制御コントロール -->
    <div class="control-group">
      <span style="font-size:12px; color:#aaa;">再生速度:</span>
      <button class="btn-sub btn-speed" data-speed="1.0">1.0x</button>
      <button class="btn-sub btn-speed" data-speed="0.75">0.75x</button>
      <button class="btn-sub btn-speed" data-speed="0.5">0.5x</button>
      <button class="btn-sub btn-speed" data-speed="0.25">0.25x</button>
    </div>

    <!-- コマ送りコントロール -->
    <div class="control-group">
      <button id="btnPrevFrame" class="btn-frame">◀ 1コマ戻す</button>
      <button id="btnNextFrame" class="btn-frame">1コマ進む ▶</button>
    </div>

    <div class="control-group">
      <button id="btnToggleOverlay">表示切替（並列 / 重ね合わせ）</button>
    </div>

    <!-- 重ね合わせ調整パネル -->
    <div id="overlayControls" style="display:none; background: #333; padding: 4px 8px; border-radius: 4px; align-items: center; gap: 8px;">
      透過比率: <input type="range" id="rangeMix" min="0" max="1" step="0.02" value="0.5">
      拡大率: <input type="range" id="rangeScale" min="0.5" max="2.0" step="0.05" value="1.0">
      <button id="btnResetTransform" style="background: #6c757d;">位置リセット</button>
    </div>

    <div class="control-group">
      <button id="btnDrawToggle">書き込み: OFF</button>
      <span id="colorPickerGroup" style="display:none; margin-left: 5px;">
        <span class="color-btn selected" data-color="#ff3333" style="background: #ff3333;"></span>
        <span class="color-btn" data-color="#33cc33" style="background: #33cc33;"></span>
        <span class="color-btn" data-color="#ffcc00" style="background: #ffcc00;"></span>
      </span>
      <button id="btnClearCanvas" style="background: #dc3545; margin-left: 5px;">全消去</button>
    </div>
  </div>

  <div class="view-container" id="container">
    <div class="video-box" id="box1">
      <video id="video1" controls playsinline webkit-playsinline muted></video>
    </div>
    <div class="video-box" id="box2">
      <video id="video2" controls playsinline webkit-playsinline muted></video>
    </div>
    
    <canvas id="drawCanvas"></canvas>
  </div>

  <script>
    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');
    const box1 = document.getElementById('box1');
    const box2 = document.getElementById('box2');
    const file1 = document.getElementById('file1');
    const file2 = document.getElementById('file2');
    const container = document.getElementById('container');
    const drawCanvas = document.getElementById('drawCanvas');
    const dCtx = drawCanvas.getContext('2d');

    let currentPlaybackRate = 1.0;
    const FRAME_TIME = 1 / 30; // 1コマあたりの秒数（約0.033秒 = 30fps換算）

    // 1. 動画読み込み
    function loadVideo(input, videoElement) {
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          videoElement.src = URL.createObjectURL(file);
          videoElement.playsInline = true;
          videoElement.muted = true;
          videoElement.playbackRate = currentPlaybackRate;
          videoElement.load();
        }
      });
    }
    loadVideo(file1, video1);
    loadVideo(file2, video2);

    // 2. 同期再生・停止・速度・コマ送り
    document.getElementById('btnPlayPause').addEventListener('click', () => {
      if (video1.paused || video2.paused) {
        video1.play().catch(()=>{});
        video2.play().catch(()=>{});
      } else {
        video1.pause();
        video2.pause();
      }
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      video1.currentTime = 0;
      video2.currentTime = 0;
    });

    // 速度切り替え機能
    const speedBtns = document.querySelectorAll('.btn-speed');
    speedBtns.forEach(btn => {
      if (btn.getAttribute('data-speed') === '1.0') btn.classList.add('active');
      
      btn.addEventListener('click', (e) => {
        speedBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        
        currentPlaybackRate = parseFloat(e.target.getAttribute('data-speed'));
        video1.playbackRate = currentPlaybackRate;
        video2.playbackRate = currentPlaybackRate;
      });
    });

    // コマ送り / コマ戻し機能
    function stepFrame(amount) {
      // コマ送り時は一旦停止させる
      video1.pause();
      video2.pause();

      video1.currentTime = Math.max(0, Math.min(video1.duration || 0, video1.currentTime + amount));
      video2.currentTime = Math.max(0, Math.min(video2.duration || 0, video2.currentTime + amount));
    }

    document.getElementById('btnPrevFrame').addEventListener('click', () => stepFrame(-FRAME_TIME));
    document.getElementById('btnNextFrame').addEventListener('click', () => stepFrame(FRAME_TIME));

    // 3. 重ね合わせ & CSS変形処理
    const btnToggleOverlay = document.getElementById('btnToggleOverlay');
    const overlayControls = document.getElementById('overlayControls');
    const rangeMix = document.getElementById('rangeMix');
    const rangeScale = document.getElementById('rangeScale');
    const btnResetTransform = document.getElementById('btnResetTransform');

    let isOverlayMode = false;
    let video2OffsetX = 0;
    let video2OffsetY = 0;

    function updateOverlayStyles() {
      if (!isOverlayMode) return;
      const opacityVal = rangeMix.value;
      const scaleVal = rangeScale.value;

      box2.style.opacity = opacityVal;
      video2.style.transform = `translate(${video2OffsetX}px, ${video2OffsetY}px) scale(${scaleVal})`;
    }

    rangeMix.addEventListener('input', updateOverlayStyles);
    rangeScale.addEventListener('input', updateOverlayStyles);

    btnToggleOverlay.addEventListener('click', () => {
      isOverlayMode = !isOverlayMode;
      container.classList.toggle('overlay-mode', isOverlayMode);
      overlayControls.style.display = isOverlayMode ? 'inline-flex' : 'none';

      if (isOverlayMode) {
        video1.controls = false;
        video2.controls = false;
        updateOverlayStyles();
      } else {
        video1.controls = true;
        video2.controls = true;
        box2.style.opacity = '1';
        video2.style.transform = 'none';
      }
      resizeCanvas();
    });

    btnResetTransform.addEventListener('click', () => {
      video2OffsetX = 0;
      video2OffsetY = 0;
      rangeScale.value = 1.0;
      rangeMix.value = 0.5;
      updateOverlayStyles();
    });

    // ドラッグ移動処理
    let isDraggingVideo = false;
    let dragStartX = 0;
    let dragStartY = 0;

    function startVideoDrag(e) {
      if (!isOverlayMode || drawMode) return;
      isDraggingVideo = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      dragStartX = clientX - video2OffsetX;
      dragStartY = clientY - video2OffsetY;
    }

    function dragVideo(e) {
      if (!isDraggingVideo) return;
      if (e.cancelable) e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      video2OffsetX = clientX - dragStartX;
      video2OffsetY = clientY - dragStartY;
      updateOverlayStyles();
    }

    function stopVideoDrag() { isDraggingVideo = false; }

    container.addEventListener('mousedown', startVideoDrag);
    container.addEventListener('mousemove', dragVideo);
    container.addEventListener('mouseup', stopVideoDrag);

    container.addEventListener('touchstart', startVideoDrag, { passive: false });
    container.addEventListener('touchmove', dragVideo, { passive: false });
    container.addEventListener('touchend', stopVideoDrag);

    // 4. 書き込み機能 & カラー切り替え
    let isDrawing = false;
    let drawMode = false;
    let currentColor = '#ff3333';

    const btnDrawToggle = document.getElementById('btnDrawToggle');
    const colorPickerGroup = document.getElementById('colorPickerGroup');

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = container.clientWidth;
      const h = container.clientHeight;
      drawCanvas.width = w * dpr;
      drawCanvas.height = h * dpr;
      dCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    btnDrawToggle.addEventListener('click', () => {
      drawMode = !drawMode;
      btnDrawToggle.textContent = `書き込み: ${drawMode ? 'ON' : 'OFF'}`;
      btnDrawToggle.style.background = drawMode ? '#28a745' : '#007bff';
      colorPickerGroup.style.display = drawMode ? 'inline' : 'none';
      drawCanvas.classList.toggle('active', drawMode);
    });

    const colorBtns = document.querySelectorAll('.color-btn');
    colorBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        colorBtns.forEach(b => b.classList.remove('selected'));
        e.target.classList.add('selected');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      if (!drawMode) return;
      isDrawing = true;
      const pos = getPos(e);
      dCtx.beginPath();
      dCtx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing || !drawMode) return;
      if (e.cancelable) e.preventDefault();
      const pos = getPos(e);
      dCtx.lineTo(pos.x, pos.y);
      dCtx.strokeStyle = currentColor;
      dCtx.lineWidth = 4;
      dCtx.lineCap = 'round';
      dCtx.lineJoin = 'round';
      dCtx.stroke();
    }

    function stopDraw() { isDrawing = false; }

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', draw);
    drawCanvas.addEventListener('mouseup', stopDraw);
    
    drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
    drawCanvas.addEventListener('touchmove', draw, { passive: false });
    drawCanvas.addEventListener('touchend', stopDraw);

    document.getElementById('btnClearCanvas').addEventListener('click', () => {
      const dpr = window.devicePixelRatio || 1;
      dCtx.clearRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
    });
  </script>
</body>
</html>
