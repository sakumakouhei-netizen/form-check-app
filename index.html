<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>フォーム比較アプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #121212; color: #fff; padding: 10px; user-select: none; -webkit-user-select: none; }
    
    .controls-container { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    
    /* 上部の一括操作・表示切替パネル */
    .global-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #222; padding: 8px 12px; border-radius: 8px; }
    
    /* 個別動画操作パネルエリア */
    .individual-controls { display: flex; gap: 10px; flex-wrap: wrap; }
    .panel { flex: 1; min-width: 300px; background: #1e1e1e; padding: 8px 12px; border-radius: 8px; border-left: 4px solid #555; }
    .panel.model-panel { border-left-color: #007bff; }
    .panel.user-panel { border-left-color: #28a745; }
    .panel-header { font-weight: bold; font-size: 13px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .panel-header.model-title { color: #66b0ff; }
    .panel-header.user-title { color: #5cdb95; }

    .control-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
    
    button, input[type="file"], input[type="range"] { font-size: 13px; padding: 5px 10px; }
    button { cursor: pointer; background: #3a3a3c; color: white; border: none; border-radius: 4px; transition: 0.1s; }
    button:hover { opacity: 0.85; }
    button:active { transform: scale(0.98); }
    
    /* 各種ボタンカラー */
    .btn-main { background: #007bff; }
    .btn-sync { background: #6f42c1; font-weight: bold; }
    .btn-sub.active { background: #28a745; font-weight: bold; }
    .btn-frame { background: #17a2b8; }
    .btn-danger { background: #dc3545; }

    .time-display { font-family: monospace; font-size: 12px; color: #ccc; min-width: 80px; text-align: right; }
    .seek-bar { flex: 1; min-width: 100px; cursor: pointer; }

    .color-btn {
      width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff;
      cursor: pointer; display: inline-block; vertical-align: middle; margin: 0 2px;
    }
    .color-btn.selected { outline: 3px solid #007bff; }

    /* メイン比較エリア */
    .view-container {
      position: relative; display: flex; width: 100%; height: calc(100vh - 250px);
      min-height: 350px; gap: 10px; background: #000; touch-action: none;
      isolation: isolate; overflow: hidden; border-radius: 8px;
    }

    .video-box {
      flex: 1; position: relative; display: flex;
      justify-content: center; align-items: center; overflow: hidden; background: #000;
    }

    video { 
      width: 100%; height: 100%; object-fit: contain; pointer-events: auto;
      -webkit-transform: translateZ(0); transform: translateZ(0);
    }

    /* 重ね合わせモード */
    .view-container.overlay-mode { display: block; }
    .view-container.overlay-mode #box1 { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .view-container.overlay-mode #box2 {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2;
      background: transparent; will-change: transform, opacity;
      -webkit-transform: translateZ(0); transform: translateZ(0);
    }
    .view-container.overlay-mode video { pointer-events: none; }

    /* お絵描きキャンバス */
    #drawCanvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10; will-change: transform;
      -webkit-transform: translateZ(0); transform: translateZ(0);
    }
    #drawCanvas.active { pointer-events: auto; cursor: crosshair; }
  </style>
</head>
<body>

  <div class="controls-container">
    <!-- 1. 全体一括コントロール -->
    <div class="global-controls">
      <button id="btnPlayPauseAll" class="btn-sync">同時再生 / 一時停止</button>
      <button id="btnResetAll">最初に戻す</button>
      
      <span style="border-left: 1px solid #444; height: 20px; margin: 0 4px;"></span>
      
      <button id="btnPrevFrameAll" class="btn-frame">◀ 同時コマ戻し</button>
      <button id="btnNextFrameAll" class="btn-frame">同時コマ送り ▶</button>

      <span style="border-left: 1px solid #444; height: 20px; margin: 0 4px;"></span>

      <button id="btnToggleOverlay" class="btn-main">表示切替（並列 / 重ね合わせ）</button>

      <!-- 重ね合わせ調整パネル -->
      <div id="overlayControls" style="display:none; align-items: center; gap: 6px; background: #333; padding: 2px 8px; border-radius: 4px;">
        <span style="font-size:12px;">透過率:</span>
        <input type="range" id="rangeMix" min="0" max="1" step="0.02" value="0.5">
        <span style="font-size:12px;">拡大率:</span>
        <input type="range" id="rangeScale" min="0.5" max="2.0" step="0.05" value="1.0">
        <button id="btnResetTransform" style="font-size:11px; padding: 2px 6px;">位置リセット</button>
      </div>

      <span style="border-left: 1px solid #444; height: 20px; margin: 0 4px;"></span>

      <!-- 書き込みコントロール -->
      <button id="btnDrawToggle">書き込み: OFF</button>
      <span id="colorPickerGroup" style="display:none;">
        <span class="color-btn selected" data-color="#ff3333" style="background: #ff3333;"></span>
        <span class="color-btn" data-color="#33cc33" style="background: #33cc33;"></span>
        <span class="color-btn" data-color="#ffcc00" style="background: #ffcc00;"></span>
      </span>
      <button id="btnClearCanvas" class="btn-danger">全消去</button>
    </div>

    <!-- 2. 個別コントロール（お手本 ＆ 自分） -->
    <div class="individual-controls">
      <!-- お手本操作パネル -->
      <div class="panel model-panel">
        <div class="panel-header model-title">
          <span>🔵 お手本動画</span>
          <input type="file" id="file1" accept="video/*" style="font-size: 11px;">
        </div>
        <div class="control-row">
          <button id="btnPlay1">再生/停止</button>
          <button id="btnPrev1" class="btn-frame">◀ コマ戻し</button>
          <button id="btnNext1" class="btn-frame">コマ送り ▶</button>
          <span style="font-size:11px; color:#aaa; margin-left: auto;">速度:</span>
          <button class="btn-sub btn-speed1" data-speed="1.0">1.0x</button>
          <button class="btn-sub btn-speed1" data-speed="0.5">0.5x</button>
          <button class="btn-sub btn-speed1" data-speed="0.25">0.25x</button>
        </div>
        <div class="control-row">
          <input type="range" id="seek1" class="seek-bar" value="0" min="0" max="100" step="0.1">
          <span id="time1" class="time-display">0:00 / 0:00</span>
        </div>
      </div>

      <!-- 自分操作パネル -->
      <div class="panel user-panel">
        <div class="panel-header user-title">
          <span>🟢 自分の動画</span>
          <input type="file" id="file2" accept="video/*" style="font-size: 11px;">
        </div>
        <div class="control-row">
          <button id="btnPlay2">再生/停止</button>
          <button id="btnPrev2" class="btn-frame">◀ コマ戻し</button>
          <button id="btnNext2" class="btn-frame">コマ送り ▶</button>
          <span style="font-size:11px; color:#aaa; margin-left: auto;">速度:</span>
          <button class="btn-sub btn-speed2" data-speed="1.0">1.0x</button>
          <button class="btn-sub btn-speed2" data-speed="0.5">0.5x</button>
          <button class="btn-sub btn-speed2" data-speed="0.25">0.25x</button>
        </div>
        <div class="control-row">
          <input type="range" id="seek2" class="seek-bar" value="0" min="0" max="100" step="0.1">
          <span id="time2" class="time-display">0:00 / 0:00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 動画表示エリア -->
  <div class="view-container" id="container">
    <div class="video-box" id="box1">
      <video id="video1" controls playsinline webkit-playsinline muted></video>
    </div>
    <div class="video-box" id="box2">
      <video id="video2" controls playsinline webkit-playsinline muted></video>
    </div>
    
    <canvas id="drawCanvas"></canvas>
  </div>

  <script>
    const video1 = document.getElementById('video1');
    const video2 = document.getElementById('video2');
    const box1 = document.getElementById('box1');
    const box2 = document.getElementById('box2');
    const file1 = document.getElementById('file1');
    const file2 = document.getElementById('file2');
    const container = document.getElementById('container');
    const drawCanvas = document.getElementById('drawCanvas');
    const dCtx = drawCanvas.getContext('2d');

    const FRAME_TIME = 1 / 30; // 1コマ＝約0.033秒 (30fps換算)

    // --- 時間フォーマット変換 ---
    function formatTime(sec) {
      if (isNaN(sec)) return "0:00";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    // --- 動画のセットアップ関数 ---
    function setupVideo(input, videoElement, seekElem, timeElem) {
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          videoElement.src = URL.createObjectURL(file);
          videoElement.playsInline = true;
          videoElement.muted = true;
          videoElement.load();
        }
      });

      // 再生中の時間更新処理
      videoElement.addEventListener('timeupdate', () => {
        if (!videoElement.duration) return;
        const pct = (videoElement.currentTime / videoElement.duration) * 100;
        seekElem.value = pct;
        timeElem.textContent = `${formatTime(videoElement.currentTime)} / ${formatTime(videoElement.duration)}`;
      });

      // シークバー操作
      seekElem.addEventListener('input', () => {
        if (!videoElement.duration) return;
        videoElement.currentTime = (seekElem.value / 100) * videoElement.duration;
      });
    }

    setupVideo(file1, video1, document.getElementById('seek1'), document.getElementById('time1'));
    setupVideo(file2, video2, document.getElementById('seek2'), document.getElementById('time2'));

    // --- 1. 同時一括コントロール ---
    document.getElementById('btnPlayPauseAll').addEventListener('click', () => {
      if (video1.paused || video2.paused) {
        video1.play().catch(()=>{});
        video2.play().catch(()=>{});
      } else {
        video1.pause();
        video2.pause();
      }
    });

    document.getElementById('btnResetAll').addEventListener('click', () => {
      video1.currentTime = 0;
      video2.currentTime = 0;
    });

    function stepFrame(video, amount) {
      video.pause();
      video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + amount));
    }

    document.getElementById('btnPrevFrameAll').addEventListener('click', () => {
      stepFrame(video1, -FRAME_TIME);
      stepFrame(video2, -FRAME_TIME);
    });

    document.getElementById('btnNextFrameAll').addEventListener('click', () => {
      stepFrame(video1, FRAME_TIME);
      stepFrame(video2, FRAME_TIME);
    });

    // --- 2. 個別コントロール（お手本：video1） ---
    document.getElementById('btnPlay1').addEventListener('click', () => {
      video1.paused ? video1.play().catch(()=>{}) : video1.pause();
    });
    document.getElementById('btnPrev1').addEventListener('click', () => stepFrame(video1, -FRAME_TIME));
    document.getElementById('btnNext1').addEventListener('click', () => stepFrame(video1, FRAME_TIME));

    const speedBtns1 = document.querySelectorAll('.btn-speed1');
    speedBtns1.forEach(btn => {
      if (btn.getAttribute('data-speed') === '1.0') btn.classList.add('active');
      btn.addEventListener('click', (e) => {
        speedBtns1.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        video1.playbackRate = parseFloat(e.target.getAttribute('data-speed'));
      });
    });

    // --- 3. 個別コントロール（自分：video2） ---
    document.getElementById('btnPlay2').addEventListener('click', () => {
      video2.paused ? video2.play().catch(()=>{}) : video2.pause();
    });
    document.getElementById('btnPrev2').addEventListener('click', () => stepFrame(video2, -FRAME_TIME));
    document.getElementById('btnNext2').addEventListener('click', () => stepFrame(video2, FRAME_TIME));

    const speedBtns2 = document.querySelectorAll('.btn-speed2');
    speedBtns2.forEach(btn => {
      if (btn.getAttribute('data-speed') === '1.0') btn.classList.add('active');
      btn.addEventListener('click', (e) => {
        speedBtns2.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        video2.playbackRate = parseFloat(e.target.getAttribute('data-speed'));
      });
    });

    // --- 4. 重ね合わせ & CSS変形処理 ---
    const btnToggleOverlay = document.getElementById('btnToggleOverlay');
    const overlayControls = document.getElementById('overlayControls');
    const rangeMix = document.getElementById('rangeMix');
    const rangeScale = document.getElementById('rangeScale');
    const btnResetTransform = document.getElementById('btnResetTransform');

    let isOverlayMode = false;
    let video2OffsetX = 0;
    let video2OffsetY = 0;

    function updateOverlayStyles() {
      if (!isOverlayMode) return;
      box2.style.opacity = rangeMix.value;
      video2.style.transform = `translate(${video2OffsetX}px, ${video2OffsetY}px) scale(${rangeScale.value})`;
    }

    rangeMix.addEventListener('input', updateOverlayStyles);
    rangeScale.addEventListener('input', updateOverlayStyles);

    btnToggleOverlay.addEventListener('click', () => {
      isOverlayMode = !isOverlayMode;
      container.classList.toggle('overlay-mode', isOverlayMode);
      overlayControls.style.display = isOverlayMode ? 'inline-flex' : 'none';

      if (isOverlayMode) {
        video1.controls = false;
        video2.controls = false;
        updateOverlayStyles();
      } else {
        video1.controls = true;
        video2.controls = true;
        box2.style.opacity = '1';
        video2.style.transform = 'none';
      }
      resizeCanvas();
    });

    btnResetTransform.addEventListener('click', () => {
      video2OffsetX = 0;
      video2OffsetY = 0;
      rangeScale.value = 1.0;
      rangeMix.value = 0.5;
      updateOverlayStyles();
    });

    // 位置合わせドラッグ操作
    let isDraggingVideo = false;
    let dragStartX = 0, dragStartY = 0;

    function startVideoDrag(e) {
      if (!isOverlayMode || drawMode) return;
      isDraggingVideo = true;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      dragStartX = clientX - video2OffsetX;
      dragStartY = clientY - video2OffsetY;
    }

    function dragVideo(e) {
      if (!isDraggingVideo) return;
      if (e.cancelable) e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      video2OffsetX = clientX - dragStartX;
      video2OffsetY = clientY - dragStartY;
      updateOverlayStyles();
    }

    function stopVideoDrag() { isDraggingVideo = false; }

    container.addEventListener('mousedown', startVideoDrag);
    container.addEventListener('mousemove', dragVideo);
    container.addEventListener('mouseup', stopVideoDrag);

    container.addEventListener('touchstart', startVideoDrag, { passive: false });
    container.addEventListener('touchmove', dragVideo, { passive: false });
    container.addEventListener('touchend', stopVideoDrag);

    // --- 5. お絵描き機能 ---
    let isDrawing = false;
    let drawMode = false;
    let currentColor = '#ff3333';

    const btnDrawToggle = document.getElementById('btnDrawToggle');
    const colorPickerGroup = document.getElementById('colorPickerGroup');

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const w = container.clientWidth;
      const h = container.clientHeight;
      drawCanvas.width = w * dpr;
      drawCanvas.height = h * dpr;
      dCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    btnDrawToggle.addEventListener('click', () => {
      drawMode = !drawMode;
      btnDrawToggle.textContent = `書き込み: ${drawMode ? 'ON' : 'OFF'}`;
      btnDrawToggle.style.background = drawMode ? '#28a745' : '#3a3a3c';
      colorPickerGroup.style.display = drawMode ? 'inline-block' : 'none';
      drawCanvas.classList.toggle('active', drawMode);
    });

    const colorBtns = document.querySelectorAll('.color-btn');
    colorBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        colorBtns.forEach(b => b.classList.remove('selected'));
        e.target.classList.add('selected');
        currentColor = e.target.getAttribute('data-color');
      });
    });

    function getPos(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDraw(e) {
      if (!drawMode) return;
      isDrawing = true;
      const pos = getPos(e);
      dCtx.beginPath();
      dCtx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing || !drawMode) return;
      if (e.cancelable) e.preventDefault();
      const pos = getPos(e);
      dCtx.lineTo(pos.x, pos.y);
      dCtx.strokeStyle = currentColor;
      dCtx.lineWidth = 4;
      dCtx.lineCap = 'round';
      dCtx.lineJoin = 'round';
      dCtx.stroke();
    }

    function stopDraw() { isDrawing = false; }

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', draw);
    drawCanvas.addEventListener('mouseup', stopDraw);
    
    drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
    drawCanvas.addEventListener('touchmove', draw, { passive: false });
    drawCanvas.addEventListener('touchend', stopDraw);

    document.getElementById('btnClearCanvas').addEventListener('click', () => {
      const dpr = window.devicePixelRatio || 1;
      dCtx.clearRect(0, 0, drawCanvas.width / dpr, drawCanvas.height / dpr);
    });
  </script>
</body>
</html>
